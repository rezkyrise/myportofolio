<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill - {{ name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav aria-label="Main Navigation">
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_skill' %}">Skill</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="skills-section" id="skill">
            <div class="container">
                <h2 class="section-title">Skills</h2>

                <div class="skills-grid">
                    {% for skill in skill_list %}
                        <div class="skill-card">
                            <h3>{{ skill.name }}</h3>
                            <p>{{ skill.get_category_display }}</p>
                            <p>{{ skill.get_proficiency_display }}</p>
                        </div>
                    {% empty %}
                        <p class="empty-state">
                            Belum ada skill yang ditambahkan.
                        </p>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
